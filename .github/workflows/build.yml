name: Build Minecraft Mod

on:
  workflow_dispatch:
  push:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12.1

      - name: Build Minecraft Mod
        run: |
          F=$(grep -rl --include=settings.gradle "amethystsmartminer" . | head -1)
          if [ -z "$F" ]; then
            echo "settings.gradle for amethystsmartminer not found. Files in repo:"
            find . -not -path './.git/*' -type f | head -50
            exit 1
          fi
          cd "$(dirname "$F")"
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AmethystSmartMiner-jar
          path: "**/build/libs/*.jar"
