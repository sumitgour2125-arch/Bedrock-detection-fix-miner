
name: Build Amethyst Aim JAR

on:
  workflow_dispatch:
  push:
    paths:
      - 'Amethyst-Aim-RANGE-PRECISION-BEDROCK-FIX.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract Mod ZIP
        run: |
          mkdir source
          unzip -o Amethyst-Aim-RANGE-PRECISION-BEDROCK-FIX.zip -d source

      - name: Build Minecraft Mod
        run: gradle -p source build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-Aim-Forge-1.21.4
          path: source/build/libs/*.jar
          if-no-files-found: error
          
