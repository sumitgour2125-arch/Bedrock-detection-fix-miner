
name: Build Amethyst Aim JAR

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '**/*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and Extract Mod ZIP
        run: |
          mkdir -p source

          ZIP=$(find . -type f \
            -name "Amethyst-Aim-RANGE-PRECISION-BEDROCK-FIX.zip" \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Mod ZIP not found!"
            find . -name "*.zip"
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          unzip -o "$ZIP" -d source

      - name: Find Minecraft Mod Project
        run: |
          BUILD_FILE=$(find source -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found!"
            find source -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Found project: $PROJECT_DIR"

      - name: Build Minecraft Mod
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload Minecraft JAR
        uses: actions/upload-artifact@v4
        with:
          name: Amethyst-Aim-Forge-1.21.4
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          
