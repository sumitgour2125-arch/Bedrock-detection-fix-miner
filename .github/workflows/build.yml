
name: Build Minecraft Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract mod source
        run: |
          unzip -o AmethystSmartMiner-source.zip -d source

      - name: Find Gradle project and build
        run: |
          F=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1)
          if [ -z "$F" ]; then
            echo "Gradle settings file not found inside ZIP"
            find source -maxdepth 4 -type f
            exit 1
          fi
          DIR=$(dirname "$F")
          cd "$DIR"
          chmod +x gradlew || true
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AmethystSmartMiner-JAR
          path: source/**/*.jar
          
